<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squaris - Square Packing Puzzle Game</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="shortcut icon" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a1b 0%, #2d2d30 50%, #1a1a1b 100%);
            color: #d7dadc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: auto;
        }
        
        #game-container {
            text-align: center;
            background: rgba(42, 42, 45, 0.8);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 900px;
        }
        
        canvas {
            border: 3px solid #343536;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            background: #2a2a2d;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            #game-container {
                padding: 20px;
                min-width: auto;
                width: 100%;
                max-width: 600px;
            }
            
            #game-title {
                font-size: 2.5em;
            }
            
            canvas {
                max-width: 100%;
                height: auto;
            }
        }
        
        @media (max-width: 480px) {
            #game-title {
                font-size: 2em;
            }
            
            #game-container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="game"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
