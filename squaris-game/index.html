<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squaris - Reddit Square Packing Game</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #1a1a1b;
            color: #d7dadc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #game-container {
            text-align: center;
        }
        #game-title {
            font-size: 2em;
            margin-bottom: 20px;
            color: #ff4500;
        }
        #timer {
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        canvas {
            border: 2px solid #343536;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1 id="game-title">Squaris</h1>
        <div id="timer">Time: 00:00</div>
        <div id="game"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
